<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title> Verification Page </title>
</head>

<body class="bg-dark">

    <div class="container mt-4 mb-4">

        <div class="card shadow">

            <div class="card-body p-4">

                <form>
                    <h2 class="text-center">RBU Campus Needs Exchange</h2><br>

                    <div class="alert alert-info">
                        <p> Verification is required to gain full access! Kindly fillout the form. </p>
                    </div>
                    <hr>

                    <div class="mb-3">
                        <h4>Basic Details</h4>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"> First Name </label>
                                <input type="text" class="form-control" placeholder="Enter your first name">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label"> Last Name </label>
                                <input type="text" class="form-control" placeholder="Enter your last name">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label"> Mobile Number </label>
                                <input type="tel" class="form-control" placeholder="Enter your mobile number">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label"> Alternative Mobile Number </label>
                                <input type="tel" class="form-control" placeholder="Enter an alternative mobile number">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label"> Email Address </label>
                                <input type="email" class="form-control" placeholder="Enter your college email">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label"> Alternative Email Address </label>
                                <input type="email" class="form-control" placeholder="Enter your personal email">
                            </div>
                        </div>
                    </div>
                    <br><hr><br>

                    <div class="mb-3">
                        <h4>College Details</h4>

                        <div class="row">
                            <div class="mb-3">
                                <label for="residence" class="form-label"> Select Residence </label>
                                <select class="form-select" id="residence">
                                    <option value=""> Select your current residence </option>
                                    <option value="off"> RBU Official Hostel </option>
                                    <option value="pg"> PG </option>
                                    <option value="loc"> Localite </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label"> Residence Address </label>
                                <textarea class="form-control" id="address" rows="2" placeholder="Enter your current address"></textarea>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label"> Select Department </label>
                                <select class="form-select" id="department">
                                    <option value=""> Select your department </option>
                                    <option value="core"> Computer Science </option>
                                    <option value="sap"> Computer Science - SAP </option>
                                    <option value="ecs"> Electronics and Computer Science </option>
                                    <option value="ibm"> Electronics and Computer Science - IBM </option>
                                    <option value="rai"> Robotics and AI </option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="year" class="form-label"> Select Year </label>
                                <select class="form-select" id="year">
                                    <option value=""> Select your year </option>
                                    <option value="one"> First Year </option>
                                    <option value="two"> Second Year </option>
                                    <option value="three"> Third Year </option>
                                    <option value="four"> Fourth Year </option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="semester" class="form-label"> Select Semester </label>
                                <select class="form-select" id="semester">
                                    <option value=""> Select your semester </option>
                                    <option value="one"> First Semester </option>
                                    <option value="two"> Second Semester </option>
                                    <option value="three"> Third Semester </option>
                                    <option value="four"> Fourth Semester </option>
                                    <option value="five"> Fifth Semester </option>
                                    <option value="six"> Sixth Semester </option>
                                    <option value="seven"> Seventh Semester </option>
                                    <option value="eigth"> Eighth Semester </option>
                                </select>
                            </div>

                            <label for="upload"> Upload ID Card</label>
                            <br>

                            <div class="mb-3">

                                <input type="file" class="form-control" id="itemimage" name="itemimage"  accept="image/*">

                            </div>

                        </div>
                    </div>
                    <br>

                    <a href="browse.html" class="btn btn-primary"> Verify </a>
                    <button type="reset" class="btn btn-secondary"> Reset Form </button>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
