<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>RBU Star Stream - Reputation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f5f7fb;
            color: #212529;
        }

        .sidebar {
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
        }

        .sidebar .nav-link {
            color: #343a40;
            border-radius: 8px;
            padding: 12px;
        }

        .sidebar .nav-link:hover {
            background-color: #eaf2ff;
            color: #0d6efd;
        }

        .sidebar .nav-link.active {
            background-color: #cfe2ff;
            color: #0d6efd;
        }

        .dashboard-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .reputation-banner {
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
            border: 1px solid #c7d2fe;
            border-radius: 18px;
        }

        .profile-icon {
            font-size: 85px;
            color: #adb5bd;
        }

        .small-muted {
            color: #6c757d;
        }

        .product-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eaf2ff;
            color: #0d6efd;
            border-radius: 10px;
            font-size: 22px;
        }

        .progress {
            height: 8px;
            background-color: #e9ecef;
        }

        .section-heading {
            font-weight: 700;
            color: #212529;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
            <div class="row">

                <div class="col-lg-2 col-md-3 bg-white border-end min-vh-100 p-3">

                    <h4 class="fw-bold mb-4">
                        <i class="bi bi-shop"></i> RBU Star Stream
                    </h4>

                    <nav class="nav flex-column">

                        <a href="browse.html" class="nav-link text-dark mb-2">
                            <i class="bi bi-bag me-2"></i> Marketplace
                        </a>

                        <a href="#" class="nav-link text-dark mb-2">
                            <i class="bi bi-chat me-2"></i> Messages
                        </a>

                        <a href="reputation.html" class="nav-link active bg-primary-subtle text-primary mb-2">
                            <i class="bi bi-star me-2"></i> Reputation
                        </a>

                    </nav>

                    <hr>

                    <nav class="nav flex-column">

                        <a href="#" class="nav-link text-dark mb-2">
                            <i class="bi bi-box me-2"></i> My Listings
                        </a>

                        <a href="#" class="nav-link text-dark mb-2">
                            <i class="bi bi-person me-2"></i> My Profile
                        </a>

                        <a href="index.html" class="nav-link text-danger mb-2">
                            <i class="bi bi-box-arrow-right me-2"></i> Log Out
                        </a>

                    </nav>

                </div>


            <main class="col-lg-7 p-3 p-md-4">

                <div class="d-flex flex-wrap justify-content-between
                            align-items-center gap-3 mb-4">

                    <div>
                        <h3 class="fw-bold mb-1">Reputation Points</h3>
                    </div>

                </div>

                
                <div class="row g-0">

                    <div class="col-12">

                        <img src="yourreputationtier.png" class="img-fluid" alt="tier">

                    </div>
                
                </div>

                <div class="row g-0">

                    <div class="col-12">

                        <img src="lendandpend.png" class="img-fluid" alt="lendandpend">

                    </div>
                
                </div>

                <div class="row g-0">

                    <div class="col-12">

                        <img src="reputationgraph.png" class="img-fluid" alt="reputationgraph">

                    </div>
                
                </div>

                <div class="row g-0">

                    <div class="col-12">

                        <img src="statustracker.png" class="img-fluid w-100" alt="statustracker">

                    </div>
                
                </div>

            </main>


            <aside class="col-lg-3 bg-white border-start p-3 p-md-4">

                <div class="row g-0">

                    <div class="col-12">

                        <img src="reputationprofile.png" class="img-fluid w-100" alt="reputationprofile">

                    </div>
                
                </div>


                <div class="row g-0">

                    <div class="col-12">

                        <img src="savedandhistory.png" class="img-fluid w-100" alt="savedandhistory">

                    </div>
                
                </div>

            </aside>

        </div>
    </div>

</body>
</html>
